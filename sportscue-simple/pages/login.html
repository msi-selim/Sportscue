<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportsCue - Sign in</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;900&family=Barlow:wght@400;500&display=swap');
  :root{--bg:#080e0b;--surface:#0d1610;--surface2:#142019;--border:#1e3828;--accent:#3ecf6e;--accent2:#1a7fc4;--text:#ddeee4;--text2:#7aa888;--red:#ff5c3a}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
  .box{width:360px;max-width:92vw;background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--accent);padding:30px 28px}
  .name{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:30px;letter-spacing:4px;text-transform:uppercase;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .sub{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text2);margin-bottom:22px}
  .title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:2px;text-transform:uppercase;margin-bottom:16px}
  label{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text2);margin-bottom:5px}
  input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 12px;font-size:14px;outline:none;margin-bottom:14px;font-family:inherit}
  input:focus{border-color:var(--accent)}
  button{width:100%;background:var(--accent);color:#04100a;border:none;padding:11px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;letter-spacing:2px;text-transform:uppercase;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  .err{display:none;margin-top:12px;color:var(--red);font-size:13px;text-align:center}
  .err.on{display:block}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="on">
  <div class="name">SportsCue</div>
  <div class="sub">Sports Annotation Studio</div>
  <div class="title">Annotator Sign In</div>
  <label for="u">Annotator ID</label>
  <input id="u" name="username" type="text" autocomplete="username" spellcheck="false" autofocus required>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button id="b" type="submit">Sign In</button>
  <div class="err" id="e"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = document.getElementById('b'), e = document.getElementById('e');
  b.disabled = true; e.classList.remove('on');
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'sportscue' },
      body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Sign in failed');
    location.href = '/app';
  } catch (err) {
    e.textContent = err.message; e.classList.add('on');
    document.getElementById('p').value = ''; document.getElementById('p').focus();
  }
  b.disabled = false;
});
</script>
</body>
</html>
